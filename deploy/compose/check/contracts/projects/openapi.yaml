# The contract of the stub in place of Projects, for the check of Edge's ticket 06. The renderer
# refuses a fragment path that is not a path of the deployable's contract.
openapi: 3.0.3
info:
  title: Projects stub for the check of Edge's ticket 06
  version: 0.0.0
paths:
  /api/v1/projects:
    get:
      responses:
        "200": {description: What the stub received}
  /api/v1/projects/{projectId}:
    get:
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: What the stub received}
  /api/v1/project-templates:
    get:
      responses:
        "200": {description: What the stub received}
